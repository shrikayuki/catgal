[project]
name = "catgal-ai-service"
version = "0.1.0"
description = "Internal AI orchestration service for Catgal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=44,<51",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "aiomysql>=0.3,<1",
    # aiomysql 0.3.2 requires the callable binary escape removed in PyMySQL 1.2.
    "pymysql[rsa]>=1.1.3,<1.2",
    "anyio>=4,<5",
    "fastapi>=0.118,<1",
    "langchain>=1.1,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.1,<2",
    "pydantic-settings>=2.11,<3",
    "redis>=6,<8",
    "socksio>=1,<2",
    "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

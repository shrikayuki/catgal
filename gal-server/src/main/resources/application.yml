# 阅读说明
# 公共 Spring 配置与业务功能开关，profile 的同名属性可覆盖当前配置。
# ${变量:默认值} 由环境注入，使用时结合 Linux 的私有环境文件查看最终有效配置。
# 数据库、Redis、MQ、搜索、AI 和存储属于不同连接与提交边界。

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: catgal
  rabbitmq:
    # 积分 Outbox 和点赞计数使用关联确认及 mandatory return，其他发送按各自模板配置。
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mvc:
    async:
      request-timeout: ${AI_SERVICE_MVC_TIMEOUT:120s}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.gal: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.catgal.server.domain.po

security:
  jwt:
    secret: ${JWT_SECRET}
    expire-ms: ${JWT_EXPIRE_MS:604800000}

catgal:
  storage:
    enabled: ${STORAGE_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:catgal-media}
  load-test:
    enabled: ${LOAD_TEST_ENABLED:false}
    target-port: ${LOAD_TEST_TARGET_PORT:${SERVER_PORT:8080}}
    target-prefix: ${LOAD_TEST_TARGET_PREFIX:}
  catalog:
    external:
      user-agent: ${CATALOG_EXTERNAL_USER_AGENT:shrikayuki/catgal/0.1 (https://github.com/shrikayuki/catgal)}
      bangumi-token: ${BANGUMI_ACCESS_TOKEN:}
      proxy-url: ${CATALOG_EXTERNAL_PROXY_URL:${HTTPS_PROXY:}}
  search:
    enabled: ${GAME_SEARCH_ENABLED:false}
    resource-enabled: ${RESOURCE_SEARCH_ENABLED:false}
    resource-alias: ${RESOURCE_SEARCH_ALIAS:catgal-resource}
    url: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    alias: ${GAME_SEARCH_ALIAS:catgal-game}
    timeout: ${GAME_SEARCH_TIMEOUT:3s}
    failure-cooldown: ${GAME_SEARCH_FAILURE_COOLDOWN:30s}
    batch-size: ${GAME_SEARCH_BATCH_SIZE:200}
    sync-delay-ms: ${GAME_SEARCH_SYNC_DELAY_MS:5000}
  ai:
    tools:
      enabled: ${AI_GAME_TOOLS_ENABLED:false}
      semantic-search-enabled: ${AI_SEMANTIC_SEARCH_ENABLED:false}
    service:
      base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8090}
      hmac-secret: ${AI_SERVICE_HMAC_SECRET:}
      persistence-enabled: ${AI_PERSISTENCE_ENABLED:false}
      personalization-enabled: ${AI_PERSONALIZATION_ENABLED:false}
      long-term-memory-enabled: ${AI_LONG_TERM_MEMORY_ENABLED:false}
      session-summary-enabled: ${AI_SESSION_SUMMARY_ENABLED:false}
      memory-candidates-enabled: ${AI_MEMORY_CANDIDATES_ENABLED:false}
      memory-vector-enabled: ${AI_MEMORY_VECTOR_ENABLED:false}
      connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:3s}
      read-timeout: ${AI_SERVICE_READ_TIMEOUT:75s}
      stream-timeout: ${AI_SERVICE_STREAM_TIMEOUT:90s}

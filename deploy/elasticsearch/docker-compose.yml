name: catgal-search

services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.11.0}
    container_name: catgal-elasticsearch-setup
    user: "0"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}
      ES_HOST_IP: ${ES_HOST_IP:-127.0.0.1}
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs
    command: >
      bash -c '
        if [ -z "$${ELASTIC_PASSWORD}" ] || [ -z "$${KIBANA_PASSWORD}" ]; then
          echo "ELASTIC_PASSWORD and KIBANA_PASSWORD are required";
          exit 1;
        fi;
        if [ ! -f config/certs/ca/ca.crt ]; then
          echo "Creating Elasticsearch certificate authority";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip -q config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/elasticsearch/elasticsearch.crt ]; then
          echo "Creating Elasticsearch node certificate";
          printf "%s\n" \
            "instances:" \
            "  - name: elasticsearch" \
            "    dns:" \
            "      - elasticsearch" \
            "      - localhost" \
            "    ip:" \
            "      - 127.0.0.1" \
            "      - $${ES_HOST_IP}" \
            > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem \
            -out config/certs/certs.zip \
            -in config/certs/instances.yml \
            -ca-cert config/certs/ca/ca.crt \
            -ca-key config/certs/ca/ca.key;
          unzip -q config/certs/certs.zip -d config/certs;
        fi;
        chown -R root:root config/certs;
        find config/certs -type d -exec chmod 750 {} \;;
        find config/certs -type f -exec chmod 640 {} \;;
        echo "Waiting for Elasticsearch";
        until curl -s --cacert config/certs/ca/ca.crt https://elasticsearch:9200 | grep -q "missing authentication credentials"; do sleep 5; done;
        echo "Configuring kibana_system user";
        until curl -s -X POST --cacert config/certs/ca/ca.crt \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" \
          https://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 5; done;
        echo "Elasticsearch security setup completed";
      '
    healthcheck:
      test: ["CMD-SHELL", "test -f config/certs/elasticsearch/elasticsearch.crt"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.11.0}
    container_name: catgal-elasticsearch
    depends_on:
      setup:
        condition: service_healthy
    environment:
      node.name: catgal-es01
      cluster.name: ${CLUSTER_NAME:-catgal-search}
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      bootstrap.memory_lock: "true"
      xpack.license.self_generated.type: basic
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms${ES_HEAP_SIZE:-1g} -Xmx${ES_HEAP_SIZE:-1g}
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs:ro
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-127.0.0.1:9200}:9200"
    mem_limit: ${ES_MEM_LIMIT:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 40s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.11.0}
    container_name: catgal-kibana
    depends_on:
      setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    environment:
      SERVERNAME: catgal-kibana
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: config/certs/ca/ca.crt
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY}
    volumes:
      - es-certs:/usr/share/kibana/config/certs:ro
      - kibana-data:/usr/share/kibana/data
    ports:
      - "${KIBANA_PORT:-127.0.0.1:5601}:5601"
    mem_limit: ${KIBANA_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 40s
    restart: unless-stopped

volumes:
  es-certs:
    name: catgal-es-certs
  es-data:
    name: catgal-es-data
  kibana-data:
    name: catgal-kibana-data

networks:
  default:
    name: catgal-search-network

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # URI excludes query strings, which may contain private search terms.
    log_format main '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout main;
    sendfile on;
    server_tokens off;

    upstream catgal_backend {
        server java:8080;
        keepalive 16;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 20m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /health/live {
            access_log off;
            default_type text/plain;
            return 200 'alive\n';
        }

        include /etc/nginx/ai-proxy.conf;

        location /api/ {
            proxy_pass http://catgal_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_next_upstream off;
        }

        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control no-store;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
